<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title class="logo-title">VIBETIX</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="fg-content">
  <div class="fg-hero">
    <div class="lock-badge">
      <ion-icon name="lock-open-outline"></ion-icon>
    </div>
    <h1>Forgot password</h1>
    <p>
      Enter the email you signed up with and we'll send you a link to reset
      your password.
    </p>
  </div>

  <div class="form-wrap">
    <ion-item lines="none" class="field">
      <ion-input
        label="Email"
        labelPlacement="floating"
        type="email"
        placeholder="you@gmail.com"
        [(ngModel)]="email"
        (keyup.enter)="send()"
      ></ion-input>
    </ion-item>

    <ion-button expand="block" class="send-btn" (click)="send()">
      Send reset link
    </ion-button>

    <p class="back-row">
      <ion-button fill="clear" size="small" routerLink="/login">Back to sign in</ion-button>
    </p>
  </div>
</ion-content>
