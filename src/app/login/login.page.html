<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="logo-title">VIBETIX</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <div class="login-hero">
    <span class="note n1">🎶</span>
    <span class="note n2">🎸</span>
    <span class="note n3">🎧</span>
    <span class="note n4">✨</span>
    <h1 class="neon">VIBETIX</h1>
    <p>Feel the beat.<br />Book the seat.</p>
    <span class="flag">Concert tickets · In seconds</span>
  </div>

  <div class="form-wrap glass">
    <ion-item lines="none" class="field">
      <ion-input
        label="Email"
        labelPlacement="floating"
        type="email"
        placeholder="you@gmail.com"
        [(ngModel)]="email"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Password"
        labelPlacement="floating"
        type="password"
        placeholder="••••••••"
        [(ngModel)]="password"
        (keyup.enter)="login()"
      ></ion-input>
    </ion-item>

    <ion-button expand="block" class="login-btn" (click)="login()" [disabled]="signingIn">
      {{ signingIn ? 'Signing in…' : 'Sign in' }}
    </ion-button>

    <div class="login-foot">
      <ion-item lines="none" class="remember">
        <ion-checkbox
          slot="start"
          [(ngModel)]="remember"
          labelPlacement="end"
        >Remember me</ion-checkbox>
      </ion-item>
      <ion-button fill="clear" size="small" routerLink="/forgot-password">
        Forgot password?
      </ion-button>
    </div>

    <div class="quick-accounts">
      <p class="quick-label">Quick sign-in · test accounts</p>
      <div class="chips">
        <ion-chip
          *ngFor="let acc of testAccounts"
          (click)="quickFill(acc.email, acc.password)"
        >
          <span class="dot" [class]="acc.dot"></span>
          <ion-label>{{ acc.label }}</ion-label>
        </ion-chip>
      </div>
    </div>

    <p class="sign-up-link">
      New here?
      <ion-button fill="clear" size="small" routerLink="/register">Create an account</ion-button>
    </p>
  </div>
</ion-content>
