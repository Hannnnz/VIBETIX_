<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard" href="/admin/dashboard">
      <ion-icon name="grid-outline" aria-hidden="true"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="events" href="/admin/events">
      <ion-icon name="musical-notes-outline" aria-hidden="true"></ion-icon>
      <ion-label>Events</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="bookings" href="/admin/bookings">
      <ion-icon name="ticket-outline" aria-hidden="true"></ion-icon>
      <ion-label>Bookings</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="reviews" href="/admin/reviews">
      <ion-icon name="star-outline" aria-hidden="true"></ion-icon>
      <ion-label>Reviews</ion-label>
      <ion-badge *ngIf="reportedReviews > 0" aria-label="Reported reviews">
        {{ reportedReviews > 99 ? '99+' : reportedReviews }}
      </ion-badge>
    </ion-tab-button>

    <ion-tab-button tab="account" href="/admin/account">
      <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
      <ion-label>Account</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
