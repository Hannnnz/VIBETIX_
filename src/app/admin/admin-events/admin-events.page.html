<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Events</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <section class="panel">
    <div class="concert-row" *ngFor="let c of concerts()">
      <div class="mini-cover" [class]="'mini-cover g' + c.color">
        {{ c.emoji }}
      </div>
      <div class="concert-info">
        <h3>{{ c.name }}</h3>
        <p>{{ dateLabel(c.date) }} · {{ c.time }}</p>
        <p class="sub">{{ c.artist }} · {{ c.venue }} ·
          {{ c.price | currency: 'PHP' : 'symbol-narrow' }} base</p>
      </div>
      <div class="actions">
        <ion-button fill="clear" size="small" (click)="edit(c)">
          <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" size="small" color="danger" (click)="remove(c)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  </section>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="add()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
