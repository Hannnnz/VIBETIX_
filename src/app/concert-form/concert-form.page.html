<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/events"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Edit concert' : 'New concert' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="form">
    <ion-item lines="none" class="field">
      <ion-input
        label="Concert name"
        labelPlacement="floating"
        [(ngModel)]="form.name"
        placeholder="e.g. Neon Nights Live"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Artist / performer"
        labelPlacement="floating"
        [(ngModel)]="form.artist"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Genre"
        labelPlacement="floating"
        [(ngModel)]="form.genre"
        placeholder="e.g. Rock"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Venue"
        labelPlacement="floating"
        [(ngModel)]="form.venue"
        placeholder="e.g. MOA Arena, Pasay"
      ></ion-input>
    </ion-item>

    <div class="row-2">
      <ion-item lines="none" class="field">
        <ion-input
          label="Date"
          labelPlacement="floating"
          type="date"
          [(ngModel)]="form.date"
        ></ion-input>
      </ion-item>
      <ion-item lines="none" class="field">
        <ion-input
          label="Time"
          labelPlacement="floating"
          type="time"
          [(ngModel)]="form.time"
        ></ion-input>
      </ion-item>
    </div>

    <ion-item lines="none" class="field">
      <ion-input
        label="Ticket price"
        labelPlacement="floating"
        type="number"
        [(ngModel)]="form.price"
        min="0"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-textarea
        label="Description"
        labelPlacement="floating"
        [(ngModel)]="form.description"
        [rows]="3"
      ></ion-textarea>
    </ion-item>

    <div class="emoji-picker">
      <p class="picker-label">Cover icon</p>
      <div class="emoji-row">
        <button
          type="button"
          class="emoji-btn"
          [class.selected]="form.emoji === e"
          *ngFor="let e of emojiChoices"
          (click)="pickEmoji(e)"
        >
          {{ e }}
        </button>
      </div>
    </div>

    <ion-button expand="block" class="save-btn" (click)="save()">
      {{ isEditing ? 'Save changes' : 'Create concert' }}
    </ion-button>
  </div>
</ion-content>
