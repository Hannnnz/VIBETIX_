<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/events"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Edit event' : 'New event' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="form">
    <ion-item lines="none" class="field">
      <ion-input
        label="Event name"
        labelPlacement="floating"
        [(ngModel)]="form.name"
        placeholder="e.g. Neon Nights Live"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Artist / performer"
        labelPlacement="floating"
        [(ngModel)]="form.artist"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Genre"
        labelPlacement="floating"
        [(ngModel)]="form.genre"
        placeholder="e.g. Rock"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Venue"
        labelPlacement="floating"
        [(ngModel)]="form.venue"
        placeholder="e.g. MOA Arena, Pasay"
      ></ion-input>
    </ion-item>

    <div class="row-2">
      <ion-item lines="none" class="field">
        <ion-input
          label="Date"
          labelPlacement="floating"
          type="date"
          [(ngModel)]="form.date"
        ></ion-input>
      </ion-item>
      <ion-item lines="none" class="field">
        <ion-input
          label="Time"
          labelPlacement="floating"
          type="time"
          [(ngModel)]="form.time"
        ></ion-input>
      </ion-item>
    </div>

    <ion-item lines="none" class="field">
      <ion-input
        label="Ticket price (Gen Ad base)"
        labelPlacement="floating"
        type="number"
        [(ngModel)]="form.price"
        min="0"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-textarea
        label="Description"
        labelPlacement="floating"
        [(ngModel)]="form.description"
        [rows]="3"
      ></ion-textarea>
    </ion-item>

    <!-- Cover image -->
    <p class="picker-label">Cover image (URL)</p>
    <div class="cover-preview">
      <img
        *ngIf="form.imageUrl && !previewBroken"
        [src]="form.imageUrl"
        alt="Cover preview"
        (error)="previewBroken = true"
      />
      <div class="no-img" *ngIf="!form.imageUrl || previewBroken">
        <ion-icon name="image-outline"></ion-icon>
        <span>No image — emoji fallback will be used</span>
      </div>
    </div>
    <ion-item lines="none" class="field">
      <ion-input
        label="Image URL"
        labelPlacement="floating"
        [(ngModel)]="form.imageUrl"
        (ngModelChange)="previewBroken = false"
        placeholder="https://…"
      ></ion-input>
    </ion-item>

    <!-- House rules -->
    <p class="picker-label">Event rules · one per line</p>
    <ion-item lines="none" class="field">
      <ion-textarea
        label="Rules"
        labelPlacement="floating"
        [(ngModel)]="form.rules"
        [rows]="5"
        placeholder="No professional cameras&#10;Doors open 1 hour before showtime"
      ></ion-textarea>
    </ion-item>

    <ion-button expand="block" class="save-btn" (click)="save()">
      {{ isEditing ? 'Save changes' : 'Create event' }}
    </ion-button>
  </div>
</ion-content>
