<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/events"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Edit event' : 'New event' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="form">
    <ion-item lines="none" class="field">
      <ion-input
        label="Event name"
        labelPlacement="floating"
        [(ngModel)]="form.name"
        placeholder="e.g. Neon Nights Live"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Artist / performer"
        labelPlacement="floating"
        [(ngModel)]="form.artist"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Genre"
        labelPlacement="floating"
        [(ngModel)]="form.genre"
        placeholder="e.g. Rock"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Venue"
        labelPlacement="floating"
        [(ngModel)]="form.venue"
        placeholder="e.g. MOA Arena, Pasay"
      ></ion-input>
    </ion-item>

    <div class="row-2">
      <ion-item lines="none" class="field">
        <ion-input
          label="Date"
          labelPlacement="floating"
          type="date"
          [(ngModel)]="form.date"
        ></ion-input>
      </ion-item>
      <ion-item lines="none" class="field">
        <ion-input
          label="Time"
          labelPlacement="floating"
          type="time"
          [(ngModel)]="form.time"
        ></ion-input>
      </ion-item>
    </div>

    <ion-item lines="none" class="field">
      <ion-input
        label="Ticket price (Gen Ad base)"
        labelPlacement="floating"
        type="number"
        [(ngModel)]="form.price"
        min="0"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-textarea
        label="Description"
        labelPlacement="floating"
        [(ngModel)]="form.description"
        [rows]="3"
      ></ion-textarea>
    </ion-item>

    <!-- Cover image -->
    <p class="picker-label">Cover image</p>
    <div class="cover-preview upload-area" (click)="chooseImage()">
      <img *ngIf="previewUrl" [src]="previewUrl" alt="Cover preview" />
      <div class="no-img" *ngIf="!previewUrl">
        <ion-icon name="image-outline"></ion-icon>
        <span>No image — emoji fallback will be used</span>
      </div>
      <input
        #fileInput
        type="file"
        accept="image/jpeg,image/png,image/webp"
        (change)="onFileSelected($event)"
        hidden
      />
    </div>
    <div class="cover-actions">
      <ion-button fill="outline" size="small" (click)="chooseImage()" [disabled]="saving">
        <ion-icon slot="start" name="image-outline"></ion-icon>
        {{ previewUrl ? 'Replace' : 'Choose image' }}
      </ion-button>
      <ion-button
        fill="clear"
        size="small"
        color="danger"
        (click)="removeImage()"
        [disabled]="saving || !previewUrl"
      >
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        Remove
      </ion-button>
    </div>
    <p class="field-error" *ngIf="imageError">{{ imageError }}</p>

    <!-- House rules -->
    <p class="picker-label">Event rules · one per line</p>
    <ion-item lines="none" class="field">
      <ion-textarea
        label="Rules"
        labelPlacement="floating"
        [(ngModel)]="form.rules"
        [rows]="5"
        placeholder="No professional cameras&#10;Doors open 1 hour before showtime"
      ></ion-textarea>
    </ion-item>

    <ion-button expand="block" class="save-btn" (click)="save()" [disabled]="saving">
      <ion-spinner *ngIf="saving" name="crescent"></ion-spinner>
      <span *ngIf="!saving">{{ isEditing ? 'Save changes' : 'Create event' }}</span>
    </ion-button>
  </div>
</ion-content>
