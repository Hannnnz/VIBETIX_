<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>Change password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="wrap">
    <p class="hint">Your account uses a temporary password. Please set a new one to continue.</p>

    <ion-item lines="none" class="field">
      <ion-input
        label="New password"
        labelPlacement="floating"
        type="password"
        [(ngModel)]="newPassword"
      ></ion-input>
    </ion-item>

    <ion-item lines="none" class="field">
      <ion-input
        label="Confirm password"
        labelPlacement="floating"
        type="password"
        [(ngModel)]="confirm"
      ></ion-input>
    </ion-item>

    <p class="error" *ngIf="error">{{ error }}</p>

    <ion-button expand="block" class="red-btn" [disabled]="saving" (click)="save()">
      {{ saving ? 'Updating…' : 'Update password' }}
    </ion-button>
  </div>
</ion-content>
