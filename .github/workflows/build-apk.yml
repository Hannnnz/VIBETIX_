name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add camera permission to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 -c "import re,sys; p='$MANIFEST'; s=open(p).read(); perm='    <uses-permission android:name=\"android.permission.CAMERA\" />\\n'; s=s.replace('<application', perm+'<application', 1) if 'android.permission.CAMERA' not in s else s; open(p,'w').write(s)"
          grep -n 'CAMERA' "$MANIFEST"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon --parallel --offline || ./gradlew assembleRelease --stacktrace --no-daemon --parallel

      - name: Sign release APK
        run: |
          cd android/app/build/outputs/apk/release
          KS=/tmp/vibetix.jks
          keytool -genkeypair -v -keystore "$KS" -keyalg RSA -keysize 2048 -validity 10000 \
            -alias vibetix -storepass vibetix123 -keypass vibetix123 \
            -dname "CN=VIBETIX, OU=Mobile, O=VIBETIX, L=Manila, S=Metro Manila, C=PH" >/dev/null 2>&1
          APK=$(ls app-release-unsigned.apk 2>/dev/null || ls *.apk | head -n1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -n1)
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias vibetix \
            --ks-pass pass:vibetix123 --key-pass pass:vibetix123 \
            --out /tmp/vibetix-release.apk "$APK"
          cp /tmp/vibetix-release.apk ./VIBETIX-v1.apk
          ls -la ./VIBETIX-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBETIX-v1-apk
          path: android/app/build/outputs/apk/release/VIBETIX-v1.apk
          if-no-files-found: error